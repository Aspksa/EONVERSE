<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EONVERSE — Living Universe</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070d17;color:#edf6ff;font:15px system-ui,sans-serif;overflow:hidden}canvas{display:block}
.panel{position:absolute;top:20px;left:20px;width:280px;background:#101b2bdc;border:1px solid #38516b;border-radius:18px;padding:20px;backdrop-filter:blur(14px);box-shadow:0 16px 50px #0007}
h1{font-size:24px;letter-spacing:4px;margin:0;color:#8ee4ec}small{color:#a6bbc8}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.stat{background:#18283c;padding:12px;border-radius:12px}.stat strong{font-size:24px;display:block}
#history{font-size:12px;color:#b8cfdb;margin-top:16px;max-height:170px;overflow:auto;line-height:1.5}
.footer{position:absolute;bottom:20px;left:20px;color:#c7d4e0;background:#101b2bc9;padding:10px 14px;border-radius:12px}#status{color:#8ee4ec}
</style>
</head>
<body>
<div class="panel">
<h1>EONVERSE</h1><small>Живая автономная вселенная · v0.1.0</small>
<div class="stats">
<div class="stat">Население<strong id="population">—</strong></div>
<div class="stat">День<strong id="tick">—</strong></div>
<div class="stat">Еда<strong id="food">—</strong></div>
<div class="stat">Древесина<strong id="wood">—</strong></div>
</div>
<div id="history">История цивилизации появится здесь.</div>
</div>
<div class="footer"><span id="status">Соединение...</span> · ЛКМ — вращать · Колесо — масштаб · ПКМ — панорама</div>
<script type="module" src="/static/world.js"></script>
</body>
</html>
